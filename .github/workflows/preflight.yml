name: preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (no MuJoCo meshes needed for CI subset)
        run: |
          python -m pip install --upgrade pip
          pip install numpy gymnasium
      - name: Static pre-flight (scale/contract/imports)
        run: |
          python preflight_ci.py
        # exits non-zero on failure -> CI fails -> blocks merge
